<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern3</title>
</head>
<body>
    <script>
        let n=parseInt(prompt("Enter the number of rows:"));
        for(let i = 1; i <= n; i++)
        {
            // Spaces
            for(let j = 1; j < i; j++)
            {
                document.write("&nbsp;&nbsp;");
            }

            // Stars
            for(let k = 1; k <= n - i + 1; k++)
            {
                document.write("* ");
            }

            document.write("<br>");
        }
    </script>
</body>
</html>
