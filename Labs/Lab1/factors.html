<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factors</title>
</head>
<body>
    <script>
        const num = parseInt(prompt("Enter a number:"));
        print("Factors of " + num + " are:");
        for (let i = 1; i <= num; i++) {
            if (num % i === 0) {
                print(i);
            }
        }
    </script>
</body>
</html>
