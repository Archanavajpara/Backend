<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci</title>
</head>
<body>
    <script>
        const num = parseInt(prompt("Enter the number of terms:"));
        let a = 0, b = 1, c;

        for (let i = 1; i <= num; i++) {
            document.write(a);
            c = a + b;
            a = b;
            b = c;
        }
    </script>
</body>
</html>
