<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime</title>
</head>
<body>
    <script>
       const num = parseInt(prompt("Enter a number:"));
       let flag = true;
         if (num <= 1) {
              flag = false;
         } 
         else {
              for (let i = 2; i <= num/2; i++) {
                if (num % i === 0) {
                     flag = false;
                     break;
                }
              }
         }
            if (flag) {
                print(num + " is a prime number.");
            } 
            else {
                print(num + " is not a prime number.");
            }
    </script>
</body>
</html>
