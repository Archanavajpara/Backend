<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <script>
        const num = parseInt(prompt("Enter a number:"));
        let factorial = 1;

            for (let i = 1; i <= num; i++) {
                factorial *= i;
            }
            print("The factorial of " + num + " is: " + factorial);
    </script>
</body>
</html>
