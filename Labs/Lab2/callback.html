<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>callback function</title>
</head>
<body>
    <script>
        function myFunction(name, callback) {
            document.write("Hello from" + name +"<br>");
            callback();
        }

        function myCall() {
            document.write("This is a callback function.");
        }

        myFunction("Darshan university", myCall);
    </script>
</body>
</html>
