<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <script>
        const fruits=["Apple","Banana","Mango","Orange"];
        document.write("<h2>List of Fruits:</h2>");
        document.write("<ul>");
        for(let i=0;i<fruits.length;i++){
            document.write("<li>"+fruits[i]+"</li>");
        }
        document.write("</ul>");
    </script>
</body>
</html>
