<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread operator</title>
</head>
<body>
    <script>
        function sum(a,b,c){
            return a+b+c;
        }
        const numbers=[1,2,3];
        const result=sum(...numbers);
        document.write("The sum is: " + result);
    </script>
</body>
</html>
