<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>default parameter</title>
</head>
<body>
    <script>
        function myfunction(a=10,b=20){
            return a+b
        }
        document.write("result1:" + myfunction() + "</br>")
        document.write("result2:" + myfunction(40,60))

    </script>
</body>
</html>
