<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for_of loop</title>
</head>
<body>
    <script>
        const numbers=[10,20,30,40,50];
        let sum=0;
        for(const num of numbers){ // num takes the value of each element in the numbers array
            sum+=num;
        }
        document.write("The sum of the numbers is: " + sum);
    </script>
</body>
</html>
