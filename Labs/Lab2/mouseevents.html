<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Click Events</title>
</head>
<body>
    <script>
        document.addEventListener("click",function(){
            alert("left clicked");
        })
        document.addEventListener("contextmenu",function(){
            alert("right clicked");
        })
    </script>
</body>
</html>
